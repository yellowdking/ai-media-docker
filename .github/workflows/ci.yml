name: CI, Docker Publish & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax, zero-paid-AI-SDK & secret-hygiene audit
        run: |
          python -m compileall -q app tests
          ! grep -Eiq '(openai|anthropic|google-generativeai|google-genai|litellm)' requirements.txt
          ! grep -Eiq 'cgi-bin/message/mass|freepublish/submit' app/wechat.py
          ! grep -rnE --exclude-dir=.git --exclude-dir=.github --exclude-dir=__pycache__ '(wx[0-9a-f]{16}|192\.168\.5\.|107\.172\.)' .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t ai-media-server:ci .

  publish-images:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and metadata
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:v${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ steps.meta.outputs.version }}

      - name: Log in to Docker Hub (if secrets configured)
        if: steps.meta.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker Hub image (if secrets configured)
        if: steps.meta.outputs.dockerhub_enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-media-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-media-server:v${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-media-server:${{ steps.meta.outputs.version }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up legacy pre-sanitization releases & tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for old_tag in v1.0.0 v1.1.0 v1.2.0 v1.2.1; do
            gh release delete "$old_tag" --yes --cleanup-tag || true
            git push origin ":refs/tags/${old_tag}" >/dev/null 2>&1 || true
          done

      - name: Auto tag & create GitHub Release from VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          TAG="v${VER}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "AI Media Docker ${TAG}" \
            --generate-notes
