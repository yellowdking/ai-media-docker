name: CI, Docker Publish & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax, zero-paid-AI-SDK & secret-hygiene audit
        run: |
          python -m compileall -q app tests
          ! grep -Eiq '(openai|anthropic|google-generativeai|google-genai|litellm)' requirements.txt
          ! grep -Eiq 'cgi-bin/message/mass|freepublish/submit' app/wechat.py
          ! grep -rnE --exclude-dir=.git --exclude-dir=.github --exclude-dir=__pycache__ '(wx[0-9a-f]{16}|192\.168\.5\.|107\.172\.)' .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t ai-media-server:ci .

  publish-images:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and metadata
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"

          TAGS=$(printf '%s\n%s\n%s' \
            "ghcr.io/${REPO_LOWER}:latest" \
            "ghcr.io/${REPO_LOWER}:v${VER}" \
            "ghcr.io/${REPO_LOWER}:${VER}")

          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            DH_USER_LOWER=$(printf '%s' "$DH_USER" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "dh_user_lower=${DH_USER_LOWER}" >> "$GITHUB_OUTPUT"
            TAGS=$(printf '%s\n%s\n%s\n%s' \
              "$TAGS" \
              "${DH_USER_LOWER}/ai-media-server:latest" \
              "${DH_USER_LOWER}/ai-media-server:v${VER}" \
              "${DH_USER_LOWER}/ai-media-server:${VER}")
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "dh_user_lower=" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if secrets configured)
        if: steps.meta.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push container images (GHCR + Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto tag & create GitHub Release from VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          TAG="v${VER}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "资讯后台管理系统 ${TAG}" \
            --generate-notes || (sleep 5 && gh release create "${TAG}" --target "${GITHUB_SHA}" --title "资讯后台管理系统 ${TAG}" --notes "Release ${TAG}")
