name: CI & Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax & zero-paid-AI-SDK audit
        run: |
          python -m compileall -q app tests
          ! grep -Eiq '(openai|anthropic|google-generativeai|google-genai|litellm)' requirements.txt
          ! grep -Eiq 'cgi-bin/message/mass|freepublish/submit' app/wechat.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t ai-media-server:ci .

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto tag & create GitHub Release from VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          TAG="v${VER}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "AI Media Docker ${TAG}" \
            --generate-notes
