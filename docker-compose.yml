services:
  ai-media-server:
    image: ${AI_MEDIA_IMAGE:-bbplin/ai-media-server:latest}
    pull_policy: always
    container_name: ai-media-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    networks:
      - npm-network
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - /opt/ai-media/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  npm-network:
    external: true
